{% extends "base.html" %}
{% block content %}
<a href="/courses" class="text-blue-600 hover:underline">â Kurslar ro'yxatiga</a>
<h1 class="text-3xl font-bold mt-2 mb-6">{{ section }} / {{ level }} / {{ country }}</h1>

<div class="bg-white rounded-lg shadow p-6 mb-6">
  <h2 class="text-xl font-bold mb-4">ð¬ DEMO (tekin)</h2>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Demo video (Bunny.net Video GUID):</label>
    <input type="text" id="demo-guid" value="{{ course.demo.video or '' }}" class="w-full px-3 py-2 border rounded">
    <input type="file" id="demo-file" accept="video/*" class="mt-2 block">
    <button onclick="uploadVideo('demo')" class="mt-2 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded">ð¤ Video yuklash</button>
    <span id="demo-status" class="ml-3 text-sm"></span>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Demo matn:</label>
    <textarea id="demo-text" rows="4" class="w-full px-3 py-2 border rounded">{{ course.demo.text or '' }}</textarea>
  </div>
</div>

<div class="bg-white rounded-lg shadow p-6 mb-6">
  <h2 class="text-xl font-bold mb-4">ð TO'LIQ KURS (pulli)</h2>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">To'liq kurs videolari (har qatorda bittadan GUID):</label>
    <textarea id="full-videos" rows="6" class="w-full px-3 py-2 border rounded" placeholder="har qator - bitta video GUID">{{ (course.full.videos or []) | join('\n') }}</textarea>
    <input type="file" id="full-file" accept="video/*" class="mt-2 block">
    <button onclick="uploadVideo('full')" class="mt-2 px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded">ð¤ Kurs video qu'shish</button>
    <span id="full-status" class="ml-3 text-sm"></span>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">To'liq kurs matni:</label>
    <textarea id="full-text" rows="6" class="w-full px-3 py-2 border rounded">{{ course.full.text or '' }}</textarea>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Gurux linki:</label>
    <input type="text" id="group-link" value="{{ link }}" class="w-full px-3 py-2 border rounded" placeholder="https://t.me/...">
  </div>
</div>

<button onclick="saveAll()" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg">ð Saqlash</button>
<span id="save-status" class="ml-3"></span>

<script>
const section = "{{ section }}";
const level = "{{ level }}";
const country = "{{ country }}";
const libraryId = "{{ library_id }}";

async function uploadVideo(kind) {
  const fileInput = document.getElementById(kind + '-file');
  const status = document.getElementById(kind + '-status');
  if (!fileInput.files || !fileInput.files[0]) {
    status.textContent = 'â Fayl tanlanmagan';
    return;
  }
  const file = fileInput.files[0];
  status.textContent = 'â³ Bunny.net'da video yaratilmoqda...';
  try {
    const fd = new FormData();
    fd.append('title', file.name);
    const c1 = await fetch('/api/bunny/create-video', { method: 'POST', body: fd });
    if (!c1.ok) throw new Error('Create failed: ' + (await c1.text()));
    const data = await c1.json();
    const guid = data.guid;
    const uploadUrl = data.upload_url;
    const accessKey = data.access_key;
    status.textContent = 'â³ Video yuklanmoqda... (bit wakt kuting)';
    const uploadResp = await fetch(uploadUrl, {
      method: 'PUT',
      headers: { 'AccessKey': accessKey, 'Content-Type': 'application/octet-stream' },
      body: file
    });
    if (!uploadResp.ok) throw new Error('Upload failed');
    status.innerHTML = '<span class="text-green-600">â Yuklandi! GUID: </span><code>' + guid + '</code>';
    if (kind === 'demo') {
      document.getElementById('demo-guid').value = guid;
    } else {
      const ta = document.getElementById('full-videos');
      ta.value = (ta.value.trim() + '\n' + guid).trim();
    }
  } catch (e) {
    status.innerHTML = '<span class="text-red-600">â ' + e.message + '</span>';
  }
}

async function saveAll() {
  const status = document.getElementById('save-status');
  status.textContent = 'â³ Saqlanmoqda...';
  const fd = new FormData();
  fd.append('demo_text', document.getElementById('demo-text').value);
  fd.append('demo_video', document.getElementById('demo-guid').value);
  fd.append('full_text', document.getElementById('full-text').value);
  fd.append('full_videos', document.getElementById('full-videos').value);
  fd.append('group_link', document.getElementById('group-link').value);
  try {
    const resp = await fetch(`/api/courses/${section}/${level}/${encodeURIComponent(country)}/save`, {
      method: 'POST', body: fd
    });
    if (!resp.ok) throw new Error('Save failed');
    status.innerHTML = '<span class="text-green-600">â Saqlandi!</span>';
  } catch (e) {
    status.innerHTML = '<span class="text-red-600">â ' + e.message + '</span>';
  }
}
</script>
{% endblock %}
